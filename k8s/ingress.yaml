apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xiangqi-ingress
  labels:
    app.kubernetes.io/name: xiangqi
    app.kubernetes.io/part-of: xiangqi-game
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod" # or your internal cert-manager issuer
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: "xiangqi-service"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
    - hosts:
        - xiangqi.internal.mycompany.com
      secretName: xiangqi-tls-cert
  rules:
    - host: xiangqi.internal.mycompany.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xiangqi-service
                port:
                  number: 80
