apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiangqi
  labels:
    app.kubernetes.io/name: xiangqi
    app.kubernetes.io/part-of: xiangqi-game
spec:
  replicas: 1
  strategy:
    type: Recreate # In-memory room state requires Recreate for single-replica to avoid split brain
  selector:
    matchLabels:
      app: xiangqi
  template:
    metadata:
      labels:
        app: xiangqi
        app.kubernetes.io/name: xiangqi
    spec:
      terminationGracePeriodSeconds: 40 # Allow clients to be notified and gracefully disconnect
      containers:
        - name: xiangqi-app
          image: xiangqi:latest # Replace with your registry image: e.g. registry.internal.mycompany.com/xiangqi:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-ws
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: xiangqi-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              httpGet:
                path: /pre-stop
                port: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
