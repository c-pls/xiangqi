name: Build and push to Docker Hub

# Builds the linux/amd64 image and pushes it to Docker Hub on every push to
# main, on version tags (v1.2.3), or manually from the Actions tab.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME - Docker Hub username, e.g. "cpdss"
#   DOCKERHUB_PASSWORD - a Docker Hub personal access token (NOT your password):
#                        Docker Hub -> Account Settings -> Security ->
#                        Personal access tokens -> Generate new token
#                        (Read & Write scope)
#
# The "cpdss/duckdb-xi" repository is created automatically on first push.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: docker.io/cpdss/duckdb-xi

permissions:
  contents: read

jobs:
  test:
    name: Test (client + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependencies
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - name: Run server tests
        run: npm --prefix server test
      - name: Run client tests
        run: |
          fail=0
          for t in tests/*.test.js; do
            node "$t" || fail=1
          done
          exit $fail

  build-and-push:
    name: Build (linux/amd64) and push to Docker Hub
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
