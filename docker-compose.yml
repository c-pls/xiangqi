# AntiGravity — multiplayer Xiangqi (server + static client in one container).
#
# Run:   docker compose up -d
# Open:  http://localhost:8080
# Logs:  docker compose logs -f
# Stop:  docker compose down
#
# No database or extra services needed: rooms live in server memory.

name: xiangqi

services:
  app:
    # Prebuilt image from CI (linux/amd64). To build from this checkout
    # instead, comment out `image:` and uncomment `build:`.
    image: docker.io/cpdss/duckdb-xi:latest
    # build: .
    container_name: xiangqi
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      # Comma-separated WebSocket origins; "*" allows all (default).
      # Set to e.g. "https://example.com,https://www.example.com" in production.
      ALLOWED_ORIGINS: "*"
      # Optional tuning (defaults shown):
      # RECONNECT_GRACE_SECONDS: "60"
      # TURN_TIMER_SECONDS: "0"
      # ROOM_CLEANUP_TIMEOUT_MS: "600000"
      # LOG_LEVEL: "info"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
